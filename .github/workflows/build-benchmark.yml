name: Benchmark Docker build changes

# This branch-only experiment does not publish images or change production tags.
on:
  push:
    branches:
      - codex/build-speed-experiment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, candidate]
    steps:
      - name: Checkout comparable source
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.variant == 'baseline' && '91fcdb7f05d3d0d785bab6ec360a4e2baee1f810' || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cold build and source-only rebuild
        shell: bash
        run: |
          set -euo pipefail
          measure() {
            local name="$1" start end
            start=$(date +%s)
            docker buildx build --platform linux/amd64 --target web --load \
              --tag importer-benchmark:web --progress plain . 2>&1 | tee "$RUNNER_TEMP/$name.log"
            end=$(date +%s)
            echo "${name}: $((end - start)) seconds" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          echo "### ${{ matrix.variant }} (AMD64 web)" >> "$GITHUB_STEP_SUMMARY"
          measure cold
          printf '\n// Cache probe: simulate an application-only change.\n' >> app/Services/Akahu/Conversion/TransactionTransformer.php
          measure source-rebuild

      - name: Verify web and CLI images
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh importer-benchmark:web -c \
            'test -s vendor/autoload.php && test -s bootstrap/cache/packages.php && test -s public/build/manifest.json && php artisan --version'
          docker buildx build --platform linux/amd64 --target cli --load \
            --tag importer-benchmark:cli --progress plain .
          docker run --rm --entrypoint php importer-benchmark:cli artisan importer:auto-import --help
